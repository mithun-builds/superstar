[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superstar"
version = "0.0.1"
description = "AI-native ticketing platform with grounded auto-decisioning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mithun Ganesh" }]
keywords = ["ticketing", "rag", "llm", "approval-workflow", "multi-tenant"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  # Web framework
  "Django>=5.0,<5.2",
  "djangorestframework>=3.15",
  "django-cors-headers>=4.3",
  "django-environ>=0.11",
  # Multi-tenancy / auth
  "django-allauth>=0.61",
  "PyJWT>=2.8",
  # DB
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  # Queue
  "celery>=5.3",
  "redis>=5.0",
  # RAG
  "sentence-transformers>=2.7",   # BGE-M3 embeddings
  "pyyaml>=6.0",                   # config + KB frontmatter
  "python-frontmatter>=1.1",       # markdown KB parsing
  # HTTP
  "httpx>=0.27",
  # Observability
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "django-stubs>=5.0",
  "factory-boy>=3.3",
  "ipython>=8.20",
]
vllm = [
  # Pinned-but-optional — only needed for self-hosted inference workers.
  "vllm>=0.5",
]

[project.urls]
Homepage = "https://github.com/mithun-builds/superstar"
Issues = "https://github.com/mithun-builds/superstar/issues"

[tool.setuptools.packages.find]
include = ["superstar*", "apps*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
