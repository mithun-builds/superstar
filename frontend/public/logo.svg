<?xml version="1.0" encoding="UTF-8"?>
<!--
  SuperStar mark.

  The shape is a ticket — a rounded square with two semicircular notches cut
  at the left and right midpoints — encoding the product (ticketing) directly
  into the silhouette. The 5-point star in the centre echoes the name and
  picks up the gold accent from the brand palette.

  Single-colour-on-white reductions are easy: render either piece in solid
  black or the SuperStar red on a white background.

  Colours are CSS custom properties so the same file can be re-themed by a
  parent <svg> wrapper without forking the path data.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SuperStar">
  <title>SuperStar</title>
  <!-- Ticket body: rounded square (radius 20) with two 24-radius semicircular
       notches cut inward at the left and right midpoints. -->
  <path
    fill="#D7242B"
    d="M 36 16
       L 220 16
       A 20 20 0 0 1 240 36
       L 240 104
       A 24 24 0 0 0 240 152
       L 240 220
       A 20 20 0 0 1 220 240
       L 36 240
       A 20 20 0 0 1 16 220
       L 16 152
       A 24 24 0 0 0 16 104
       L 16 36
       A 20 20 0 0 1 36 16
       Z"
  />
  <!-- 5-point star: outer radius 64, inner radius 28, centered (128,128). -->
  <!-- 5-point star, point up. Vertices alternate outer (R=64) and inner
       (r=28). Centred at (128,128). i=5 is the BOTTOM INNER point (not the
       outermost — that's a common bug). -->
  <polygon
    fill="#F5C518"
    points="128,64 144.5,105.4 188.9,108.2 154.6,136.7 165.6,179.8 128,156 90.4,179.8 101.4,136.7 67.1,108.2 111.5,105.4"
  />
</svg>
