name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: superstar
          POSTGRES_PASSWORD: superstar
          POSTGRES_DB: superstar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://superstar:superstar@localhost:5432/superstar
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-not-for-prod
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      LLM_PROVIDER: noop
      EMBEDDING_MODEL: BAAI/bge-m3
      SUPERSTAR_CONFIG_DIR: ./examples/kb-it-access

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy superstar apps config

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Test
        run: pytest --cov=superstar --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
