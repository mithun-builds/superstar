# SuperStar CI.
#
# Runs on every push to main and every PR. Two jobs in parallel so the
# whole pipeline finishes in ~5 minutes:
#
#   - backend  → pytest, against a real Postgres+pgvector service container
#                and a real Redis. Eval-harness internals are tested as part
#                of the suite; the management command itself is exercised by
#                a smoke step at the end with LLM_PROVIDER=noop.
#   - frontend → tsc -b --noEmit (type-check) + vitest + lint + build.
#
# Both jobs cache their dependency managers (pip + npm) so warm builds
# are about a minute faster than cold ones.
#
# Things deliberately NOT in CI yet:
#   - A real LLM-backed eval run. Would need a vLLM service container or
#     a hosted endpoint with a model big enough to be meaningful; both add
#     real cost + flake. The noop smoke covers the wiring.
#   - Linting (ruff, mypy). The repo declares them as dev deps but isn't
#     yet clean against them; adding the gate before the cleanup would
#     just block merges. Land the cleanup, then add the gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run if the same branch gets pushed again. Saves
# minutes on PR rebases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: superstar
          POSTGRES_PASSWORD: superstar
          POSTGRES_DB: superstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Everything reads from environ via config/settings/base.py.
      DATABASE_URL: postgresql://superstar:superstar@localhost:5432/superstar
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-not-a-real-secret-key-do-not-reuse
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # CI has no LLM service; the noop client returns escalate-by-policy,
      # which is fine for the test suite — tests that need specific decisions
      # patch the client directly (apps/decisioning/test_eval_harness.py).
      LLM_PROVIDER: noop
      DECISIONING_CONFIDENCE_THRESHOLD: "0.85"
      DECISIONING_SHADOW_MODE: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: pytest -ra --tb=short

      - name: Eval-harness smoke (LLM_PROVIDER=noop)
        # Exercises the management command end-to-end against an in-memory
        # golden file. With the noop provider every decision is "escalate",
        # so we set the bar at refusal-recall on an all-escalate fixture.
        # This is the wiring test — real quality numbers come from a
        # real-LLM run done outside CI.
        run: |
          mkdir -p /tmp/ci-eval
          cat > /tmp/ci-eval/golden.jsonl <<'EOF'
          {"example_id": "ci-1", "ticket_type": "ci.smoke", "payload": {"x": "y"}, "expected_decision": "escalate"}
          EOF
          python manage.py shell <<'PY'
          from apps.tenants.models import Org
          from apps.tickets.models import TicketType, TicketTypeField, WorkflowStage
          from apps.kb.models import RuleChunk
          from django.contrib.auth import get_user_model

          U = get_user_model()
          org, _ = Org.objects.get_or_create(slug='ci', defaults={'name': 'CI Org'})
          U.objects.get_or_create(email='ci@local.test', defaults={'password': 'x'})
          tt, _ = TicketType.objects.get_or_create(
              org=org, identifier='ci.smoke',
              defaults=dict(display_name='Smoke', ai_enabled=True, shadow_mode=True, system_prompt='noop'),
          )
          TicketTypeField.objects.get_or_create(
              ticket_type=tt, name='x',
              defaults=dict(order=0, field_type='string', label='X', required=True),
          )
          WorkflowStage.objects.get_or_create(
              ticket_type=tt, order=1,
              defaults=dict(name='Review', approvers=['ci'], mode='any_member'),
          )
          RuleChunk.objects.get_or_create(
              org=org, rule_id='R1',
              defaults=dict(
                  plugin_identifier='ci.smoke', ticket_type=tt,
                  title='r', body='b', embedding=[0.0]*1024, extra={},
              ),
          )
          PY
          python manage.py eval_decisioning /tmp/ci-eval/golden.jsonl \
            --org ci --cleanup --min-refusal-recall 1.0

  frontend:
    name: frontend (vitest + tsc + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (production bundle)
        run: npm run build
